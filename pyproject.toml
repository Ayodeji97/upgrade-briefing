[project]
name = "upgrade-briefing"
version = "0.1.0"
description = "Cited upgrade briefings for AndroidX libraries: what breaks, what is deprecated and what is new between your pinned version and the latest."
readme = "README.md"
authors = [
    { name = "Daniel Ogunleye" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
briefing-scrape = "upgrade_briefing.ingest.scrape:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
